[project]
name = "hunyen3d"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bitsandbytes>=0.50.0",
    "hydra-core>=1.3",
    "matplotlib>=3.11.1",
    "mesh-to-sdf>=0.0.15",
    "scikit-image>=0.25",
    "scipy>=1.18.0",
    "torch>=2.12.1",
    "tqdm>=4.66",
    "transformers>=5.14.1",
    "trimesh>=4.12.2",
    "wandb>=0.18",
]

[project.optional-dependencies]
# Encoders for the ULIP-I / Uni3D-I metrics (heavy; only needed to run those with real weights).
metrics-3d = [
    "open_clip_torch>=2.24",
    "timm>=1.0",
    "pillow>=10.0",
    "easydict>=1.13",
    "h5py>=3.16.0",
    "termcolor>=3.3.0",
    "lmdb>=2.3.0",
    "pyyaml-env-tag>=1.1",
    "ninja>=1.13.0",
]

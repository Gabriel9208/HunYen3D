defaults:
  - model: shape_vae
  - task: vae
  - loss@task.recon_loss: weighted   # 注入 task.recon_loss;實驗可 override 成 clamp
  - data: shape_vae
  - optimizer: adamw
  - scheduler: cosine
  - trainer: default
  - wandb: default
  - preprocess: default
  - _self_

# Run each job from its own output dir, so checkpoints/ and logs are isolated per run.
hydra:
  job:
    chdir: true

# Mesh -> Fourier-embedded surface points. Consumed by data/shape_vae.yaml via ${preprocess}.
# Fourier only acts on xyz (3 dims); normal/label are concatenated as-is:
#   encoder_pe_dim = fourier(3).out_dim + (in_channels - 3) = 3*(2*pe_freqs+1) + 4 = 51 + 4 = 55
#   decoder_pe_dim = fourier(3).out_dim                     = 3*(2*pe_freqs+1)     = 51
_target_: src.model.shape.preprocess.Preprocessor
pe_freqs: 8
in_channels: 7              # xyz + normal + sharpedge label
include_input: true
include_pi: true            # multiply Fourier frequencies by π (official vae-v2-1 uses false; deliberately true here)
random_sample_count: 2048   # FPS query points from random surface samples
important_sample_count: 2048 # FPS query points from sharp edges
downsample_ratio: 20        # KV/data per branch = downsample_ratio * {random,important}_sample_count (Hunyuan uses 20)
num_surface_samples: 81920 # dense surface samples before downsampling
n_query_surface: 200000     # SDF bank: near-surface sample count (offline once, can be large)
n_query_uniform: 50000      # SDF bank: uniform-over-volume sample count (offline once, can be large)
sdf_sample_point_count: 2000000  # mesh_to_sdf surface sample count; default 1e7 is slow, 2e6 is ~3x faster with almost no GT accuracy loss (MAE 0.0001)
sdf_subset: 16384           # how many points to draw from the SDF bank to supervise per step; null=use all (250k OOMs, decoder cross-attn activations too large).
                            # with a large bank, set this (e.g. 8192) to save decoder memory and give per-epoch variation

# @package _global_
# Anchor A/B against vae_baseline_1024_l8_16: identical run (1024 tokens, enc8/dec16, ratio-20, plain MSE,
# kl1e-3, cosine 3.5e-5→1e-6, 20 ep) with ONLY the model swapped base VAE → AnchorVAE (per-latent anchor
# coords + anchor cross-attention, anchor stack = 6 layers). Isolates whether anchors help reconstruction.
# Launch:  +experiment=anchor_baseline_1024_l8_16
defaults:
  - /capacity: baseline_lat1024_l8_16
  - override /model: anchor_vae
  - _self_

optimizer:
  lr: 3.5e-5
  weight_decay: 0

task:
  kl_weight: 1e-3
  anchor_chamfer_weight: 1.0   # 主: pull anchors onto the FPS query surface (chamfer). Starting value — watch
  anchor_mse_weight: 0.1       # 輔: index-aligned per-token MSE. anchor_cd/anchor_mse are logged; retune vs recon
  recon_loss:
    near_beta: 0             # plain unweighted MSE

trainer:
  val_interval: 1            # val (incl. viou/siou) every epoch → watch the plateau live
  amp: true
  resume: null
  max_epochs: 20

data:
  train:
    dataset:
      fixed_seed: null
  val:
    dataset:
      fixed_seed: 0

wandb:
  project: HunYen3D
  entity: null
  name: anchor_baseline_1024_l8_16
  tags: [anchor, vae, lat1024, deep]
  mode: online
  id: null
  resume: allow

hydra:
  run:
    dir: outputs/anchor_baseline_1024_l8_16/${now:%Y-%m-%d_%H-%M-%S}

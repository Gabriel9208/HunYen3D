# @package _global_
# Architecture-vs-supervision split (ablation queue #3). IDENTICAL to anchor_kl1e3_1024_l8_16 — same
# AnchorVAE (anchor stack + anchor cross-attention, dec16), kl1e-3, plain MSE, cosine 3e-4→1e-6, 20 ep —
# EXCEPT both anchor supervision weights are 0. The anchor architecture still runs every decode
# (AnchorVAE.decode always computes anchors + feeds pe_anchors to the decoder, vae.py:126-131); only the
# chamfer/mse losses vanish (task.py:200 skips the block when both weights are 0). So this arm keeps the
# anchor MECHANISM but removes the anchor SUPERVISION.
#   anchor_baseline (arch + supervision)  vs  this (arch only)  vs  vae_baseline_l8_22 (capacity, no arch)
#   → if this ≈ l8_22 capacity: the anchor win was the supervision, not the architecture.
#   → if this ≈ anchor_baseline: the architecture alone carries it (unlikely given detach failed).
# Launch:  +experiment=anchor_archonly_1024_l8_16
defaults:
  - /capacity: baseline_lat1024_l8_16
  - override /model: anchor_vae
  - _self_

optimizer:
  lr: 3e-4
  weight_decay: 0

task:
  kl_weight: 1e-3
  anchor_chamfer_weight: 0.0   # supervision removed — anchor arch still runs in decode, just unsupervised
  anchor_mse_weight: 0.0       # supervision removed
  recon_loss:
    near_beta: 0             # plain unweighted MSE

trainer:
  val_interval: 1
  amp: true
  resume: null
  max_epochs: 20

data:
  train:
    dataset:
      fixed_seed: null
  val:
    dataset:
      fixed_seed: 0

wandb:
  project: HunYen3D
  entity: null
  name: anchor_archonly_1024_l8_16
  tags: [anchor, vae, lat1024, deep, kl1e3, ablation, arch-only, nosup]
  mode: online
  id: null
  resume: allow

hydra:
  run:
    dir: outputs/anchor_archonly_1024_l8_16/${now:%Y-%m-%d_%H-%M-%S}

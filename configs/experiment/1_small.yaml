# @package _global_
# Small version: halve the layers, halve the latents, for fast comparison experiments (not SOTA).
# num_latents is tied to the encoder query length = random_sample_count + important_sample_count,
# so cutting latents must also cut those two (both light params, not in cache_signature → won't invalidate existing caches).
# width / latent_dim / pe_freqs stay; only the depth and latent count are cut.
defaults:
  - override /model: shape_vae
  - override /task: vae
  - override /data: shape_vae

model:
  num_latents: 2048          # 4096 -> 2048
  num_encoder_layers: 4      # 8 -> 4
  num_decoder_layers: 8      # 16 -> 8

preprocess:
  random_sample_count: 1024      # 2048 -> 1024 (coupled to num_latents)
  important_sample_count: 1024   # 2048 -> 1024 (coupled to num_latents)

optimizer:
  lr: 3e-4
  weight_decay: 0

task:
  kl_weight: 1e-4

trainer:
  val_interval: 1
  amp: true
  grad_accum_steps: 8
  resume: /home/gabriel/dev/HunYen3D/outputs/2026-07-02/19-06-50/checkpoints/last.pt
data:
  batch_size: 4
  train:
    dataset:
      fixed_seed: null
  val:
    dataset:
      fixed_seed: 0

wandb:
  project: HunYen3D
  entity: null
  name: null
  tags: []
  mode: online 
  id: sv047kzw
  resume: allow
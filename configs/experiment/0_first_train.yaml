# @package _global_
defaults:
  - override /model: shape_vae
  - override /task: vae
  - override /data: shape_vae

optimizer:
  lr: 3e-4
  weight_decay: 0

task:
  kl_weight: 1e-4          

trainer:
  val_interval: 1   
  amp: true        
  grad_accum_steps: 8      

data:                    # obj_root/cache_dir/mode come from data/shape_vae.yaml; here we only freeze sampling
  train:
    dataset:
      fixed_seed: null
  val:
    dataset:
      fixed_seed: 0

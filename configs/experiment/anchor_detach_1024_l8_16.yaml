# @package _global_
# Detach ablation of anchor_baseline_1024_l8_16: IDENTICAL run (AnchorVAE, 1024 tokens, enc8/dec16 + 6-layer
# anchor stack, ratio-20, plain MSE, kl1e-4, chamfer 1.0 / mse 0.1) with the ONLY change being
# detach_anchor=true — the anchor branch (self.anchor) is fed z.detach(), so neither the chamfer/mse
# supervision nor recon-through-anchor sends gradient into the encoder/z. The latent is shaped purely by the
# direct SDF recon path; the anchor is a read-only predictor riding on top.
# Answers: does letting anchor gradient into the encoder help or hurt reconstruction (vs the non-detach arm)?
# Launch:  +experiment=anchor_detach_1024_l8_16
defaults:
  - /capacity: baseline_lat1024_l8_16
  - override /model: anchor_vae
  - _self_

model:
  detach_anchor: true         # the only difference vs anchor_baseline_1024_l8_16

optimizer:
  lr: 3e-4
  weight_decay: 0

task:
  kl_weight: 1e-4
  anchor_chamfer_weight: 1.0   # 主, same as the non-detach arm
  anchor_mse_weight: 0.1       # 輔, same as the non-detach arm
  recon_loss:
    near_beta: 0             # plain unweighted MSE

trainer:
  val_interval: 1
  amp: true
  resume: null
  max_epochs: 20

data:
  train:
    dataset:
      fixed_seed: null
  val:
    dataset:
      fixed_seed: 0

wandb:
  project: HunYen3D
  entity: null
  name: anchor_detach_1024_l8_16
  tags: [anchor, vae, lat1024, deep, detach, ablation]
  mode: online
  id: null
  resume: allow

hydra:
  run:
    dir: outputs/anchor_detach_1024_l8_16/${now:%Y-%m-%d_%H-%M-%S}

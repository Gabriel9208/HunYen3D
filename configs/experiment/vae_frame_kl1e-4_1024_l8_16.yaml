# @package _global_
defaults:
  - /capacity: baseline_lat1024_l8_16   # enc8/dec16 depth + batch/accum convention; preprocess counts overridden below
  - override /model: frame_vae
  - override /data: shape_vae_frame
  - override /scheduler: null
  - _self_

optimizer:
  lr: 3.5e-5
  weight_decay: 0

model:
  num_latents: 1024   # FrameEncoder output length = important_sample_count below; latent_dim stays
                        # 64 (frame_vae.yaml default, unchanged)
  encoder_pe_dim: 52
  decoder_pe_dim: 51

preprocess:
  random_sample_count: 1024
  important_sample_count: 1024   # -> FrameEncoder sees 1024 sharp query points

task:
  kl_weight: 1e-4
  recon_loss:
    near_beta: 0

trainer:
  max_epochs: -1
  val_interval: 1
  amp: true
  resume: null

data:
  train:
    dataset:
      fixed_seed: null
  val:
    dataset:
      fixed_seed: 0

wandb:
  project: HunYen3D
  entity: null
  name: vae_frame_kl1e-4_1024_l8_16
  tags: [vae, lat1024, deep, kl1e4, frame, sharp-only]
  mode: online
  id: null
  resume: allow

hydra:
  run:
    dir: outputs/vae_frame_kl1e-4_1024_l8_16/${now:%Y-%m-%d_%H-%M-%S}

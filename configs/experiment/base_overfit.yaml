# @package _global_
# Usage: uv run python main.py +experiment=overfit
# Collects every override needed to overfit a single mesh in one file (replacing the overfit variants scattered across groups).
defaults:
  - override /model: shape_vae
  - override /task: vae
  - override /data: shape_vae
  # To fix the LR (closer to a pure overfit), uncomment this line:
  # - override /scheduler: null

optimizer:               # layered on top of adamw (keeps _target_/_partial_/betas)
  lr: 1e-4               # 1e-3 diverges (measured: loss shoots into the thousands); 1e-4 descends stably
  weight_decay: 0        # turn off weight decay so it doesn't block fitting

task:                    # layered on top of vae (keeps _target_)
  kl_weight: 0           # turn off KL, confirm reconstruction ability first

trainer:
  val_interval: 999999   # effectively disable val (overfit only watches train loss)
  amp: true              # enable autocast (runner uses bf16) to fit in GPU memory

preprocess:              # layered on top of default, only shrink sample counts to speed up each epoch
  num_surface_samples: 20000
  n_query_surface: 2000
  n_query_uniform: 500
  downsample_ratio: 2    # historical: inherited default random=2048, old fixed KV=4096 → ratio 2

data:                    # obj_root/cache_dir/mode come from data/shape_vae.yaml; here we only freeze sampling
  train:
    dataset:
      fixed_seed: 0      # freeze each epoch's sampling → data stops changing, so it can converge cleanly
  val:
    dataset:
      fixed_seed: 0

# @package _global_
# Sign decoupling: weighted MSE (distance) + α·BCE (sign). From-scratch small model.
# Sweep α/k via task.recon_loss.sign_weight / task.recon_loss.sign_temp; sign_weight=0 reverts to plain weighted MSE.
defaults:
  - override /model: shape_vae
  - override /task: vae
  - override /loss@task.recon_loss: sign_aware   # switch to SignAwareSDFLoss
  - override /data: shape_vae

model:
  num_latents: 2048
  num_encoder_layers: 4
  num_decoder_layers: 8

preprocess:
  random_sample_count: 1024
  important_sample_count: 1024

optimizer:
  lr: 3e-4
  weight_decay: 0

task:
  kl_weight: 1e-4

trainer:
  val_interval: 1
  amp: true
  grad_accum_steps: 8
  resume: null

data:
  batch_size: 4
  train:
    dataset:
      fixed_seed: null
  val:
    dataset:
      fixed_seed: 0

wandb:
  project: HunYen3D
  entity: null
  name: 4_sign_aware
  tags: []
  mode: online
  id: null
  resume: allow

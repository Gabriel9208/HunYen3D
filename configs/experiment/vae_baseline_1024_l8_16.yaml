# @package _global_
# THE VAE baseline run for this research: 1024 tokens + enc8/dec16 (Hunyuan3D-2 recon config) on the
# full 45k. Plain MSE, kl1e-4, cosine 3e-4→1e-6, budget ~20 ep (from A@20's ~ep15-17 plateau + margin;
# val logs S-IoU each epoch → stop early once flat). This is the single reference-aligned baseline that
# replaces the capacity grid.
# Launch:  +experiment=vae_baseline_1024_l8_16
defaults:
  - /capacity: baseline_lat1024_l8_16
  - _self_

optimizer:
  lr: 3e-4
  weight_decay: 0

task:
  kl_weight: 1e-4
  recon_loss:
    near_beta: 0             # plain unweighted MSE

trainer:
  val_interval: 1            # val (incl. viou/siou) every epoch → watch the plateau live
  amp: true
  resume: null
  max_epochs: 20

data:
  train:
    dataset:
      fixed_seed: null
  val:
    dataset:
      fixed_seed: 0

wandb:
  project: HunYen3D
  entity: null
  name: vae_baseline_1024_l8_16
  tags: [baseline, vae, lat1024, deep]
  mode: online
  id: null
  resume: allow

hydra:
  run:
    dir: outputs/vae_baseline_1024_l8_16/${now:%Y-%m-%d_%H-%M-%S}

# @package _global_
# Sign decoupling (hinge version): weighted MSE + α·relu(margin − pred·sign(gt)). Penalizes the sign
# with basic math, replacing BCE which blows pred up (see loss_sign_aware's failure). Sweep α via task.recon_loss.sign_weight.
defaults:
  - override /model: shape_vae
  - override /task: vae
  - override /loss@task.recon_loss: sign_hinge
  - override /data: shape_vae

model:
  num_latents: 2048
  num_encoder_layers: 4
  num_decoder_layers: 8

preprocess:
  random_sample_count: 1024
  important_sample_count: 1024

optimizer:
  lr: 3e-4
  weight_decay: 0

task:
  kl_weight: 1e-4

trainer:
  val_interval: 1
  amp: true
  grad_accum_steps: 8
  resume: null

data:
  batch_size: 4
  train:
    dataset:
      fixed_seed: null
  val:
    dataset:
      fixed_seed: 0

wandb:
  project: HunYen3D
  entity: null
  name: loss_sign_hinge
  tags: []
  mode: online
  id: null
  resume: allow

# @package _global_
# Deeper net (enc6/dec12) + plain unweighted MSE (near_beta=0) + cosine scheduler (LR decays),
# 7 epochs. Same as 9_deep_mse_nosched but with the scheduler ON (9 stalled at constant LR).
defaults:
  - override /model: shape_vae
  - override /task: vae
  - override /loss@task.recon_loss: weighted   # WeightedSDFLoss; near_beta=0 below makes it plain MSE
  - override /data: shape_vae

model:
  num_latents: 2048
  num_encoder_layers: 6      # small=4
  num_decoder_layers: 12     # small=8

preprocess:
  random_sample_count: 1024
  important_sample_count: 1024

optimizer:
  lr: 3e-4
  weight_decay: 0

task:
  kl_weight: 1e-4
  recon_loss:
    near_beta: 0             # degenerates WeightedSDFLoss to plain unweighted MSE

trainer:
  val_interval: 1
  amp: true
  grad_accum_steps: 16       # batch 2 × 16 = effective 32
  resume: null

data:
  batch_size: 2              # enc6/dec12 OOMs at batch 4 (smoke-tested)
  train:
    dataset:
      fixed_seed: null
  val:
    dataset:
      fixed_seed: 0

wandb:
  project: HunYen3D
  entity: null
  name: 10_deep_mse
  tags: []
  mode: online
  id: null
  resume: allow

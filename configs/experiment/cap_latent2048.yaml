# @package _global_
# Capacity experiment A: num_latents=2048 (the current small model). weighted MSE, from-scratch.
# Differs from cap_latent4096 only in num_latents (+ coupled sampling counts); measures latent capacity vs near-surface sign.
defaults:
  - override /model: shape_vae
  - override /task: vae
  - override /data: shape_vae

model:
  num_latents: 2048
  num_encoder_layers: 4
  num_decoder_layers: 8

preprocess:
  random_sample_count: 1024      # + important = 2048 = num_latents
  important_sample_count: 1024

optimizer:
  lr: 3e-4
  weight_decay: 0

task:
  kl_weight: 1e-4

trainer:
  val_interval: 1
  amp: true
  grad_accum_steps: 8
  resume: null

data:
  batch_size: 4        # confirmed runnable via smoke_test
  train:
    dataset:
      fixed_seed: null
  val:
    dataset:
      fixed_seed: 0

wandb:
  project: HunYen3D
  entity: null
  name: cap_latent2048
  tags: []
  mode: online
  id: null
  resume: allow

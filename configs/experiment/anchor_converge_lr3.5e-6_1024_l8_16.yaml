# @package _global_
# Continuation of anchor_converge_1024_l8_16 with the LR dropped 10× (3.5e-5 → 3.5e-6) to settle the
# constant-LR plateau (RESEARCH_LOG Stage-1: constant LR floors at the SGD noise ball; a lower LR settles
# closer). Resumes from that run's best.pt (keeps Adam moments + epoch/step counter); the _resume lr-override
# (runner.py, scheduler-less branch) makes the config lr win over the checkpoint's old 3.5e-5. Logged as a NEW
# wandb run (id: null) and a NEW hydra run dir, so the pre-÷10 run's best.pt/last.pt are never overwritten.
# Launch:  +experiment=anchor_converge_lr3.5e-6_1024_l8_16
defaults:
  - /capacity: baseline_lat1024_l8_16
  - override /model: anchor_vae
  - override /scheduler: null   # constant LR (no scheduler); the _resume lr-override applies here
  - _self_

optimizer:
  lr: 3.5e-6                    # 10× lower than the 3.5e-5 converge run
  weight_decay: 0

task:
  kl_weight: 1e-3
  anchor_chamfer_weight: 1.0
  anchor_mse_weight: 0.1
  recon_loss:
    near_beta: 0

trainer:
  max_epochs: -1                # infinite: train until manually stopped
  val_interval: 1
  amp: true
  # resume from the pre-÷10 converge run's best.pt (Adam moments + epoch/step restored; lr forced to 3.5e-6)
  resume: /home/gabriel/dev/HunYen3D/outputs/anchor_converge_lr3.5e-6_1024_l8_16/2026-07-27_07-41-47/checkpoints/last.pt

data:
  train:
    dataset:
      fixed_seed: null
  val:
    dataset:
      fixed_seed: 0

wandb:
  project: HunYen3D
  entity: null
  name: anchor_converge_lr3.5e-6_1024_l8_16
  tags: [anchor, vae, lat1024, deep, kl1e3, converge, constant-lr, lr3.5e-6, resume]
  mode: online
  id: 3r78eepe                  # continue the SAME wandb run (resume the paused lr3.5e-6 curve)
  resume: allow

hydra:
  run:
    dir: outputs/anchor_converge_lr3.5e-6_1024_l8_16/${now:%Y-%m-%d_%H-%M-%S}

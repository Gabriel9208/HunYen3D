# @package _global_
# Capacity experiment B: num_latents=4096 (double the latents). weighted MSE, from-scratch.
# Differs from cap_latent2048 only in num_latents (+ coupled sampling counts); measures latent capacity vs near-surface sign.
defaults:
  - override /model: shape_vae
  - override /task: vae
  - override /data: shape_vae

model:
  num_latents: 4096
  num_encoder_layers: 4
  num_decoder_layers: 8

preprocess:
  random_sample_count: 2048      # + important = 4096 = num_latents
  important_sample_count: 2048
  downsample_ratio: 2   # historical: old fixed KV=4096 per branch = ratio 2 x 2048 (NOT the 20 default)

optimizer:
  lr: 3e-4
  weight_decay: 0

task:
  kl_weight: 1e-4

trainer:
  val_interval: 1
  amp: true
  grad_accum_steps: 16   # batch 2 × 16 = effective 32, aligned with cap_latent2048 (4×8)
  resume: null

data:
  batch_size: 2        # smoke_test:batch 4 OOM,batch 2 = 9.15 GiB OK
  train:
    dataset:
      fixed_seed: null
  val:
    dataset:
      fixed_seed: 0

wandb:
  project: HunYen3D
  entity: null
  name: cap_latent4096
  tags: []
  mode: online
  id: null
  resume: allow

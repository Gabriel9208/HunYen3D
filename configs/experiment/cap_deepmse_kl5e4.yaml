# @package _global_
# Same as cap_deepmse (enc6/dec12, latent 2048, plain MSE, cosine) but kl_weight=5e-4.
# Probes an intermediate KL: kl=1e-4 kept sampling-val dropping but let the posterior mean
# drift off-manifold under long training (mu/val gap 1.2x->3.4x @20ep, IoU 45->36, near 3.2->5.0);
# kl=1e-3 healed 4096 but capped recon. 5e-4 tests the middle. 7ep for a clean head-to-head with §5e.
defaults:
  - override /model: shape_vae
  - override /task: vae
  - override /loss@task.recon_loss: weighted   # WeightedSDFLoss; near_beta=0 below makes it plain MSE
  - override /data: shape_vae

model:
  num_latents: 2048
  num_encoder_layers: 6      # small=4
  num_decoder_layers: 12     # small=8

preprocess:
  random_sample_count: 1024
  important_sample_count: 1024

optimizer:
  lr: 3e-4
  weight_decay: 0

task:
  kl_weight: 5e-4
  recon_loss:
    near_beta: 0             # degenerates WeightedSDFLoss to plain unweighted MSE

trainer:
  val_interval: 1
  amp: true
  grad_accum_steps: 16       # batch 2 × 16 = effective 32
  resume: null

data:
  batch_size: 2              # enc6/dec12 OOMs at batch 4 (smoke-tested)
  train:
    dataset:
      fixed_seed: null
  val:
    dataset:
      fixed_seed: 0

wandb:
  project: HunYen3D
  entity: null
  name: cap_deepmse_kl5e4
  tags: []
  mode: online
  id: null
  resume: allow

# @package _global_
defaults:
  - vae_baseline_1024_l8_16
  - override /data: shape_vae_disjoint
  - override /scheduler: null   # constant LR, matching vae_converge_kl1e-4_1024_l8_16 (the template this mirrors)
  - _self_

task:
  kl_weight: 1e-4

trainer:
  max_epochs: -1   # train until manually stopped, same as vae_converge_kl1e-4_1024_l8_16

wandb:
  name: vae_disjoint_kl1e-4_1024_l8_16
  tags: [baseline, vae, lat1024, deep, kl1e-4, converge, constant-lr, disjoint-fps]

hydra:
  run:
    dir: outputs/vae_disjoint_kl1e-4_1024_l8_16/${now:%Y-%m-%d_%H-%M-%S}

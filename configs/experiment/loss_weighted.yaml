# @package _global_
# Near-surface weighted MSE (WeightedSDFLoss), from-scratch small model.
# Uses the default weighted group (configs/loss/weighted.yaml); tune λ/β via
#   task.recon_loss.near_weight / task.recon_loss.near_beta; near_beta=0 degenerates to unweighted.
defaults:
  - override /model: shape_vae
  - override /task: vae
  - override /data: shape_vae

model:
  num_latents: 2048
  num_encoder_layers: 4
  num_decoder_layers: 8

preprocess:
  random_sample_count: 1024
  important_sample_count: 1024
  downsample_ratio: 4   # historical: old fixed KV=4096 per branch = ratio 4 x 1024 (NOT the 20 default)

optimizer:
  lr: 3e-4
  weight_decay: 0

task:
  kl_weight: 1e-4

trainer:
  val_interval: 1
  amp: true
  grad_accum_steps: 8
  resume: null

data:
  batch_size: 4
  train:
    dataset:
      fixed_seed: null
  val:
    dataset:
      fixed_seed: 0

wandb:
  project: HunYen3D
  entity: null
  name: loss_weighted
  tags: []
  mode: online
  id: null
  resume: allow

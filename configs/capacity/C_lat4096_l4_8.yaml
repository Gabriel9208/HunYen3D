# @package _global_
# Grid cell C: latent 4096, enc4/dec8 (small). Batch/accum from the OOM-tested cap_latent4096.
model:
  num_latents: 4096
  num_encoder_layers: 4
  num_decoder_layers: 8
preprocess:
  random_sample_count: 2048
  important_sample_count: 2048
data:
  batch_size: 2
trainer:
  grad_accum_steps: 16     # 2 × 16 = effective 32

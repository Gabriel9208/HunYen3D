_target_: src.model.shape.diffusion.MM_DiT.MM_DiT
double_stream_layers: 16
single_stream_layers: 32
width: 1024
num_head: 16
mlp_expansion: 4
drop_prob: 0.0
in_channel: 64
out_channel: 64
latent_in_dim: 64
cond_in_dim: 1024
time_in_dim: 256
time_factor: 1000
use_anchor: false
rope_theta: 10000
rope_axes_dim: [22, 22, 20]
rope_coord_scale: 4.0

# Activation checkpointing on every DiT block: recompute activations in backward instead of storing
# them. ~30% slower, but the 1.1B DiT + on-the-fly VAE encode is at the 16GB edge without it.
use_checkpoint: true

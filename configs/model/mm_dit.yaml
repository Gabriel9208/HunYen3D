# Flow-matching MM-DiT denoiser. Predicts velocity on VAE latents conditioned on image features.
#   latent_in_dim = VAE latent_dim (64); latent token count = VAE num_latents (1024).
#   cond_in_dim   = DINOv2-Giant feature dim (1536); cond token count is arbitrary (DoubleStream
#                   handles any length), so DINO patch tokens need no resampling.
# NB: latent_in_dim MUST equal out_channel — the sampler integrates x = x + v, so the predicted
#     velocity must share the latent's channel dim.
_target_: src.model.shape.diffusion.MM_DiT.MM_DiT
double_stream_layers: 16
single_stream_layers: 32
width: 1024
num_head: 16
mlp_expansion: 4
drop_prob: 0.0
in_channel: 64
out_channel: 64
latent_in_dim: 64
cond_in_dim: 1536
time_in_dim: 256
time_factor: 1000

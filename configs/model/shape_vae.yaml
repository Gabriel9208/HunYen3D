# Shape VAE. Dims must stay consistent with the preprocess config:
#   encoder_pe_dim == query/data 寬度 = fourier(xyz) + normal = 3*(2*pe_freqs+1) + 3 = 39 + 3 = 42
#   decoder_pe_dim == SDF 查詢點寬度 = fourier(xyz)        = 3*(2*pe_freqs+1)     = 39
#   num_latents    == FPS query 長度 = random_sample_count + important_sample_count = 6144
_target_: src.model.shape.VAE.vae.VAE
num_latents: 6144
encoder_pe_dim: 42
decoder_pe_dim: 39
latent_dim: 64
width: 1024
num_head: 16
num_encoder_layers: 8
num_decoder_layers: 16

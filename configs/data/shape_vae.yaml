# obj meshes -> VAE encoder inputs。dataset 透過 ${preprocess} 取得共用的 Preprocessor。
# 預設 mode=light:讀 cache_dir 下由 scripts/build_cache.py 產生的快取(訓練前先跑一次)。
# 想即時跑(無快取/debug)改 mode=heavy。
batch_size: 1
num_workers: 0

train:
  dataset:
    _target_: src.engine.data.ObjMeshDataset
    obj_root: ${hydra:runtime.cwd}/data/train
    preprocessor: ${preprocess}
    pattern: "*.off"
    mode: light
    cache_dir: ${hydra:runtime.cwd}/cache

val:
  dataset:
    _target_: src.engine.data.ObjMeshDataset
    obj_root: ${hydra:runtime.cwd}/data/val
    preprocessor: ${preprocess}
    pattern: "*.off"
    mode: light
    cache_dir: ${hydra:runtime.cwd}/cache

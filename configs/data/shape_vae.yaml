# obj meshes -> VAE encoder inputs. The dataset gets the shared Preprocessor via ${preprocess}.
# Default mode=light: read the cache under cache_dir produced by scripts/build_cache.py (run once before training).
# For on-the-fly runs (no cache / debug) switch to mode=heavy.
batch_size: 1
num_workers: 8

train:
  dataset:
    _target_: src.engine.data.ObjMeshDataset
    obj_root: ${hydra:runtime.cwd}/data/train
    preprocessor: ${preprocess}
    pattern: "*.off.gz"
    mode: light
    cache_dir: ${hydra:runtime.cwd}/cache

val:
  dataset:
    _target_: src.engine.data.ObjMeshDataset
    obj_root: ${hydra:runtime.cwd}/data/val
    preprocessor: ${preprocess}
    pattern: "*.off.gz"
    mode: light
    cache_dir: ${hydra:runtime.cwd}/cache
